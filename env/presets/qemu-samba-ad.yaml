# Two qemu VMs from the published Fedora 45 image: an IPA server and a Samba
# AD domain controller (ad.test), for the AD trust tests of the integration
# suite. The harness drives the DC with samba-tool because the AD host is
# marked `host_type: samba` in the generated test configuration.
# Needs /dev/kvm and podman.
name: qemu-samba-ad
domain: ipa.test
ad_domain: ad.test
provider: nested
inner: external
hosts:
  - {role: master, name: master1}
  - {role: ad, name: dc1, os: samba}
resources:
  master: {memory: 3300m, memory-swap: 6600m}
  ad: {memory: 1536m, memory-swap: 2048m}
run:
  mode: integration
  tests:
    # the second test uses the ID override that the first one adds
    - test_integration/test_idviews.py::TestCertsInIDOverrides::test_certs_in_idoverrides_ad_users
    - test_integration/test_idviews.py::TestCertsInIDOverrides::test_dbus_user_lookup
vm:
  backend: qemu
  image: containerdisk:ghcr.io/freeipa/ci-freeipa-vm-images/fedora-45:latest
  cpus: 4
  disk: 40G
  guest_packages: [ipa-distro]
