provider: nested
name: qemu-copr-customized_ds_config_install
domain: ipa.test
hosts:
- role: master
  name: master1
- role: replica
  name: replica1
resources:
  master:
    memory: 3300m
    memory-swap: 6600m
  replica:
    memory: 3300m
    memory-swap: 6600m
run:
  mode: integration
  setup_dns: true
  setup_kra: true
  tests:
  - test_integration/test_customized_ds_config_install.py
inner: external
vm:
  backend: qemu
  image: containerdisk:ghcr.io/freeipa/ci-freeipa-vm-images/fedora-45:latest
  cpus: 4
  disk: 40G
  guest_packages:
  - ipa-distro
  copr:
  - abbra/pqc
  selinux: enforcing
  vms:
  - name: master1
    image: ~/.cache/freeipa-ci/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2
