name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends qemu-utils podman python3-yaml python3-pytest
      - name: Tests
        run: python3 -m pytest env/tests -q

  # Boots a VM from the published Fedora 45 image and installs a FreeIPA
  # server on it with this checkout's freeipa-env: the qemu backend, the
  # containerdisk pull, guest_packages and the integration run, end to end.
  qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PRESET: env/presets/qemu-smoke.yaml
      WORK: ${{ github.workspace }}/work
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the host
        run: |
          # let the runner user use KVM; load the module first, since a
          # runner may not have loaded it
          sudo modprobe kvm_intel 2>/dev/null || sudo modprobe kvm_amd 2>/dev/null || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          for _ in $(seq 15); do [ -w /dev/kvm ] && break; sleep 2; done
          if [ ! -w /dev/kvm ]; then
              ls -l /dev/kvm* 2>&1 || true
              lscpu | grep -i -E 'model name|hypervisor|virtualization' || true
              echo "::error::/dev/kvm is not available on this runner (no nested virtualization)"
              exit 1
          fi
          # azure.archive.ubuntu.com, the runner's default mirror, sometimes
          # does not resolve: use the main archive, then kernel.org's mirror
          sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' \
              /etc/apt/apt-mirrors.txt /etc/apt/sources.list \
              /etc/apt/sources.list.d/* 2>/dev/null || true
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for attempt in 1 2 3; do
              # shellcheck disable=SC2086
              sudo apt-get $apt_opts update && sudo apt-get $apt_opts install -y --no-install-recommends \
                  qemu-system-x86 qemu-utils xorriso rsync openssh-client podman python3-yaml && break
              [ "$attempt" = 3 ] && { echo "::error::apt is unreachable"; exit 1; }
              echo 'https://mirrors.edge.kernel.org/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              sudo sed -i -E 's#https?://([a-z]+\.)?(archive|security)\.ubuntu\.com/ubuntu/?#https://mirrors.edge.kernel.org/ubuntu/#g' \
                  /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
              sleep 10
          done
          # the VMs authorize the runner's ssh key
          [ -e ~/.ssh/id_ed25519 ] || ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
          mkdir -p "$WORK"

      - name: Test - install a FreeIPA server on the published image
        run: |
          cli=env/freeipa-env
          wd=(--workdir "$WORK/env")
          rc=0
          "$cli" up "$PRESET" "${wd[@]}" && "$cli" run "$PRESET" "${wd[@]}" || rc=$?
          "$cli" summary "$PRESET" "${wd[@]}" >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          "$cli" down "$PRESET" "${wd[@]}" || true
          exit $rc

      - name: Keep the test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-logs
          path: work/env/logs
          retention-days: 14
          if-no-files-found: ignore
